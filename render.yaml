# Render static site for hpxshinez.com
# Deploys from hpxshinez-frontend/ on push. Legal routes get pre-built HTML;
# everything else falls through to the SPA index.html rewrite.
services:
  - type: web
    name: hpxshinez-website
    runtime: static
    rootDir: hpxshinez-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy/index.html
      - type: rewrite
        source: /liability-disclaimer
        destination: /liability-disclaimer/index.html
      - type: rewrite
        source: /cancellation-policy
        destination: /cancellation-policy/index.html
      - type: rewrite
        source: /*
        destination: /index.html
